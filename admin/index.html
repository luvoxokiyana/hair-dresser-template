<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Admin</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/img/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <meta name="theme-color" content="#FAF6F1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="admin-body">

  <main class="a-login-page">
    <form class="a-login" id="login-form" novalidate>
      <h1 class="a-login-brand">Salon</h1>
      <p class="a-login-sub">Sign in to manage your salon.</p>

      <div class="a-field">
        <label class="a-label" for="email">Email</label>
        <input class="a-input" id="email" name="email" type="email" autocomplete="username" required autofocus>
      </div>

      <div class="a-field">
        <label class="a-label" for="password">Password</label>
        <input class="a-input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>

      <button class="a-btn a-btn-primary a-btn-block" type="submit" id="submit">Sign in</button>
      <p class="a-error" id="err" role="alert"></p>
    </form>
  </main>

  <script type="module">
    import { supabase, signIn, getSession } from '/assets/js/supabase.js';
    import { CONFIG } from '/assets/js/config.js';

    /* Brand from config */
    document.querySelector('.a-login-brand').textContent = CONFIG.SITE_NAME || 'Admin';

    /* Already signed in? Skip to dashboard. */
    const existing = await getSession();
    if (existing) window.location.replace('/admin/dashboard.html');

    const form = document.getElementById('login-form');
    const err  = document.getElementById('err');
    const btn  = document.getElementById('submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        await signIn(form.email.value.trim(), form.password.value);
        window.location.replace('/admin/dashboard.html');
      } catch (ex) {
        err.textContent = ex.message || 'Sign in failed.';
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
