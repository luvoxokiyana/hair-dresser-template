<!DOCTYPE html>
<html lang="en-ZA">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookings — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>

<body class="admin-body">

  <div class="admin-shell">
    <aside class="a-sidebar" id="sidebar"></aside>

    <div class="a-main">
      <header class="a-topbar" id="topbar"></header>

      <main class="a-content">
        <div class="a-page-head a-page-head--split">
          <div>
            <h1 class="a-page-title">Bookings</h1>
            <p class="a-page-sub">All bookings, filterable and searchable.</p>
          </div>
          <button type="button" class="a-btn a-btn-primary" id="new-booking-btn">+ New booking</button>
        </div>

        <!-- Filter bar -->
        <div class="a-card" style="margin-bottom: 16px;">
          <div class="a-filter-bar">
            <div class="a-filter">
              <label class="a-filter-label" for="f-status">Status</label>
              <select class="a-input a-input-sm" id="f-status">
                <option value="active">Active (confirmed + completed)</option>
                <option value="all">All</option>
                <option value="confirmed">Confirmed</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
                <option value="no_show">No-show</option>
              </select>
            </div>

            <div class="a-filter">
              <label class="a-filter-label" for="f-range">Date range</label>
              <select class="a-input a-input-sm" id="f-range">
                <option value="today">Today</option>
                <option value="week" selected>This week</option>
                <option value="next7">Next 7 days</option>
                <option value="month">This month</option>
                <option value="all">All time</option>
                <option value="past">Past</option>
              </select>
            </div>

            <div class="a-filter">
              <label class="a-filter-label" for="f-service">Service</label>
              <select class="a-input a-input-sm" id="f-service">
                <option value="">All services</option>
              </select>
            </div>

            <div class="a-filter a-filter--grow">
              <label class="a-filter-label" for="f-search">Search</label>
              <input class="a-input a-input-sm" id="f-search" type="search" placeholder="Client name or phone…">
            </div>

            <div class="a-filter">
              <label class="a-filter-label" for="f-sort">Sort</label>
              <select class="a-input a-input-sm" id="f-sort">
                <option value="asc" selected>Oldest first</option>
                <option value="desc">Newest first</option>
              </select>
            </div>

            <button type="button" class="a-btn a-btn-ghost a-btn-sm" id="f-reset">Reset</button>
          </div>
        </div>

        <!-- Results -->
        <div class="a-card">
          <div class="a-card-head">
            <h2 class="a-card-title" id="results-title">Loading…</h2>
            <span class="a-results-count" id="results-count"></span>
          </div>
          <div class="a-card-body a-card-body--flush" id="bookings-list">
            <div class="a-empty">
              <h3>Loading…</h3>
            </div>
          </div>
        </div>

        <!-- Pagination -->
        <div class="a-pagination" id="pagination"></div>
      </main>
    </div>
  </div>

  <script type="module" src="/admin/assets/bookings.js"></script>
</body>

</html>
