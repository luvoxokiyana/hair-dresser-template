<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="admin-body">

  <div class="admin-shell">
    <aside class="a-sidebar" id="sidebar"></aside>

    <div class="a-main">
      <header class="a-topbar" id="topbar"></header>

      <main class="a-content">
        <div class="a-page-head">
          <h1 class="a-page-title">Dashboard</h1>
          <p class="a-page-sub">Today, this week, and what needs your attention.</p>
        </div>

        <!-- Stats -->
        <div class="a-stat-grid">
          <div class="a-stat">
            <p class="a-stat-label">Today</p>
            <p class="a-stat-value" id="stat-today">—</p>
            <p class="a-stat-meta">bookings</p>
          </div>
          <div class="a-stat">
            <p class="a-stat-label">This week</p>
            <p class="a-stat-value" id="stat-week">—</p>
            <p class="a-stat-meta">bookings</p>
          </div>
          <div class="a-stat">
            <p class="a-stat-label">No-shows</p>
            <p class="a-stat-value" id="stat-noshows">—</p>
            <p class="a-stat-meta">this week</p>
          </div>
          <div class="a-stat">
            <p class="a-stat-label">Revenue</p>
            <p class="a-stat-value" id="stat-revenue">—</p>
            <p class="a-stat-meta">this week · completed</p>
          </div>
        </div>

        <!-- Today's schedule -->
        <div class="a-card" style="margin-bottom: 24px;">
          <div class="a-card-head">
            <h2 class="a-card-title">Today's schedule</h2>
            <a href="/admin/calendar.html" class="a-btn a-btn-ghost a-btn-sm">View calendar</a>
          </div>
          <div class="a-card-body a-card-body--flush" id="today-list">
            <div class="a-empty">
              <h3>Loading…</h3>
            </div>
          </div>
        </div>

        <!-- Week summary -->
        <div class="a-card">
          <div class="a-card-head">
            <h2 class="a-card-title">This week</h2>
            <a href="/admin/bookings.html" class="a-btn a-btn-ghost a-btn-sm">All bookings</a>
          </div>
          <div class="a-card-body" id="week-summary">
            <p class="a-page-sub">Loading…</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/admin/assets/dashboard.js"></script>
</body>
</html>
