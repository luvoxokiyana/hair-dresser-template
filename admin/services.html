<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services — Admin</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/img/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <meta name="theme-color" content="#FAF6F1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="admin-body">

  <div class="admin-shell">
    <aside class="a-sidebar" id="sidebar"></aside>

    <div class="a-main">
      <header class="a-topbar" id="topbar"></header>

      <main class="a-content">
        <div class="a-page-head a-page-head--split">
          <div>
            <h1 class="a-page-title">Services</h1>
            <p class="a-page-sub">What you offer, how long it takes, and what it costs.</p>
          </div>
          <button type="button" class="a-btn a-btn-primary" id="new-service-btn">+ New service</button>
        </div>

        <div class="a-card">
          <div class="a-card-head">
            <h2 class="a-card-title">Active services</h2>
            <span class="a-results-count" id="active-count"></span>
          </div>
          <div class="a-card-body a-card-body--flush" id="services-active">
            <div class="a-skeleton-row">
            <div class="a-skeleton a-skeleton-block a-skeleton-block--short"></div>
            <div class="a-skeleton a-skeleton-block"></div>
            <div class="a-skeleton a-skeleton-block a-skeleton-block--short"></div>
          </div>
          <div class="a-skeleton-row">
            <div class="a-skeleton a-skeleton-block a-skeleton-block--short"></div>
            <div class="a-skeleton a-skeleton-block"></div>
            <div class="a-skeleton a-skeleton-block a-skeleton-block--short"></div>
          </div>
          <div class="a-skeleton-row">
            <div class="a-skeleton a-skeleton-block a-skeleton-block--short"></div>
            <div class="a-skeleton a-skeleton-block"></div>
            <div class="a-skeleton a-skeleton-block a-skeleton-block--short"></div>
          </div>
          </div>
        </div>

        <div class="a-card" style="margin-top: 24px;">
          <div class="a-card-head">
            <h2 class="a-card-title">Inactive services</h2>
            <span class="a-results-count" id="inactive-count"></span>
          </div>
          <div class="a-card-body a-card-body--flush" id="services-inactive">
            <div class="a-skeleton-row">
            <div class="a-skeleton a-skeleton-block a-skeleton-block--short"></div>
            <div class="a-skeleton a-skeleton-block"></div>
            <div class="a-skeleton a-skeleton-block a-skeleton-block--short"></div>
          </div>
          <div class="a-skeleton-row">
            <div class="a-skeleton a-skeleton-block a-skeleton-block--short"></div>
            <div class="a-skeleton a-skeleton-block"></div>
            <div class="a-skeleton a-skeleton-block a-skeleton-block--short"></div>
          </div>
          <div class="a-skeleton-row">
            <div class="a-skeleton a-skeleton-block a-skeleton-block--short"></div>
            <div class="a-skeleton a-skeleton-block"></div>
            <div class="a-skeleton a-skeleton-block a-skeleton-block--short"></div>
          </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/admin/assets/services.js"></script>
</body>
</html>
