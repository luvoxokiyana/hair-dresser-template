<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Availability — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="admin-body">

  <div class="admin-shell">
    <aside class="a-sidebar" id="sidebar"></aside>

    <div class="a-main">
      <header class="a-topbar" id="topbar"></header>

      <main class="a-content">
        <div class="a-page-head">
          <h1 class="a-page-title">Availability</h1>
          <p class="a-page-sub">Your working hours, and any time you need to block off.</p>
        </div>

        <!-- Weekly hours -->
        <div class="a-card">
          <div class="a-card-head">
            <h2 class="a-card-title">Weekly hours</h2>
            <span class="a-results-count" id="weekly-count"></span>
          </div>
          <div class="a-card-body a-card-body--flush" id="weekly-list">
            <div class="a-empty"><h3>Loading…</h3></div>
          </div>
        </div>

        <!-- Blocks -->
        <div class="a-card" style="margin-top: 24px;">
          <div class="a-card-head">
            <h2 class="a-card-title">Blocks</h2>
            <button type="button" class="a-btn a-btn-primary a-btn-sm" id="new-block-btn">+ Block time</button>
          </div>
          <div class="a-card-body a-card-body--flush" id="blocks-list">
            <div class="a-empty"><h3>Loading…</h3></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/admin/assets/availability.js"></script>
</body>
</html>
